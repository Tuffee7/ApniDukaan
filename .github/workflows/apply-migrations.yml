name: Apply EF Core Migrations

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: "admin"
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P admin -Q \"SELECT 1\"" \
          --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore tools
        run: dotnet tool restore || true
      - name: Restore and build
        run: |
          dotnet restore
          dotnet build --configuration Release
      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            nc -z localhost 1433 && break || sleep 2
          done
      - name: Apply EF Core migrations
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ApniDukaanUsers;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
        run: |
          dotnet ef database update --no-build --project ApniDukaan.API/ApniDukaan.API.csproj --startup-project ApniDukaan.API/ApniDukaan.API.csproj --connection "$ConnectionStrings__DefaultConnection"
